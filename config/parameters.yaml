temperature_monitor:
  ros__parameters:
    high: 80.0
    low: 75.0
    alpha: 0.2
    stale_timeout: 1.0

temperature_sensor:
  ros__parameters:
    mode: "deterministic"
    initial_temperature: 74.0
    publish_rate: 10.0
    noise_std: 0.15
    spindle_rpm: 750.0

evidence_logger:
  ros__parameters:
    output_dir: "evidence"
